<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect x="50" y="50" width="120" height="60" fill="currentColor" opacity="0.2"/>
<text x="110" y="85" text-anchor="middle" font-family="monospace" font-size="14">protocol()</text>
<text x="110" y="100" text-anchor="middle" font-family="monospace" font-size="10">(reset/start/stop/tune)</text>

<line x1="170" y1="80" x2="250" y2="80" stroke="currentColor" stroke-width="2"/>
<rect x="250" y="50" width="120" height="60" fill="currentColor" opacity="0.2"/>
<text x="310" y="85" text-anchor="middle" font-family="monospace" font-size="14">checkBattery()</text>

<line x1="390" y1="80" x2="470" y2="80" stroke="currentColor" stroke-width="2"/>
<rect x="470" y="50" width="120" height="60" fill="currentColor" opacity="0.2"/>
<text x="530" y="85" text-anchor="middle" font-family="monospace" font-size="14">checkTilt()</text>

<line x1="610" y1="80" x2="690" y2="80" stroke="currentColor" stroke-width="2"/>
<rect x="690" y="50" width="110" height="40" fill="currentColor" opacity="0.2"/>
<text x="745" y="70" text-anchor="middle" font-family="monospace" font-size="12">return</text>

<line x1="110" y1="130" x2="110" y2="200" stroke="currentColor" stroke-width="2"/>
<rect x="50" y="200" width="120" height="40" fill="currentColor" opacity="0.2"/>
<text x="110" y="220" text-anchor="middle" font-family="monospace" font-size="14">checkButton()</text>

<line x1="110" y1="240" x2="110" y2="310" stroke="currentColor" stroke-width="2"/>
<rect x="50" y="310" width="120" height="40" fill="currentColor" opacity="0.2"/>
<text x="110" y="330" text-anchor="middle" font-family="monospace" font-size="14">checkClap()</text>

<line x1="110" y1="350" x2="110" y2="420" stroke="currentColor" stroke-width="2"/>
<rect x="50" y="420" width="120" height="40" fill="currentColor" opacity="0.2"/>
<text x="110" y="440" text-anchor="middle" font-family="monospace" font-size="14">checkSerial()</text>

<line x1="110" y1="460" x2="110" y2="500" stroke="currentColor" stroke-width="2"/>
<text x="130" y="500" font-family="monospace" font-family="monospace" font-size="12" fill="currentColor">↓</text>

<line x1="170" y1="170" x2="250" y2="170" stroke="currentColor" stroke-width="2"/>
<rect x="250" y="170" width="120" height="40" fill="currentColor" opacity="0.2"/>
<text x="310" y="190" text-anchor="middle" font-family="monospace" font-size="14">autoLight()</text>

<line x1="390" y1="170" x2="470" y2="170" stroke="currentColor" stroke-width="2"/>
<rect x="470" y="170" width="120" height="40" fill="currentColor" opacity="0.2"/>
<text x="530" y="190" text-anchor="middle" font-family="monospace" font-size="14">updateHeading()</text>

<line x1="610" y1="170" x2="690" y2="170" stroke="currentColor" stroke-width="2"/>
<rect x="690" y="170" width="110" height="40" fill="currentColor" opacity="0.2"/>
<text x="745" y="190" text-anchor="middle" font-family="monospace" font-size="12">BT/RC</text>

<line x1="110" y1="480" x2="110" y2="540" stroke="currentColor" stroke-width="2"/>
<text x="130" y="540" font-family="monospace" font-size="12" fill="currentColor">↓</text>

<rect x="250" y="220" width="120" height="220" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1"/>
<text x="310" y="330" text-anchor="middle" font-family="monospace" font-size="14" fill="currentColor">driveLoop</text>

<text x="310" y="360" text-anchor="middle" font-family="monospace" font-size="10" fill="currentColor">if status.jalan:</text>

<line x1="310" y1="380" x2="310" y2="460" stroke="currentColor" stroke-width="2"/>
<text x="310" y="500" text-anchor="middle" font-family="monospace" font-size="12" fill="currentColor">↓</text>

<rect x="250" y="220" width="300" height="220" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1"/>
<text x="400" y="200" text-anchor="middle" font-family="monospace" font-size="12" fill="currentColor">Ultrasonic Stop</text>
<text x="400" y="220" text-anchor="middle" font-family="monospace" font-size="10" fill="currentColor">≤5cm → return</text>

<line x1="460" y1="260" x2="460" y2="340" stroke="currentColor" stroke-width="2"/>
<text x="470" y="330" font-family="monospace" font-size="12" fill="currentColor">↓</text>

<rect x="420" y="220" width="180" height="80" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1"/>
<text x="510" y="260" text-anchor="middle" font-family="monospace" font-size="12" fill="currentColor">RACING prediction</text>
<text x="510" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="currentColor">MAP prediction</text>

<line x1="600" y1="260" x2="600" y2="340" stroke="currentColor" stroke-width="2"/>
<text x="610" y="330" font-family="monospace" font-size="12" fill="currentColor">↓</text>

<rect x="540" y="220" width="120" height="120" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1"/>
<text x="600" y="260" text-anchor="middle" font-family="monospace" font-size="12" fill="currentColor">RC Mode</text>
<text x="600" y="300" text-anchor="middle" font-family="monospace" font-size="12" fill="currentColor">takeover</text>

<line x1="600" y1="400" x2="600" y2="460" stroke="currentColor" stroke-width="2"/>
<text x="610" y="500" font-family="monospace" font-size="12" fill="currentColor">↓</text>

<text x="400" y="460" font-family="monospace" font-size="14" text-anchor="middle" fill="currentColor">Control Flow Diagram</text>
</svg>