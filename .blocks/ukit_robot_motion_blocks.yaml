        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "80"

# Block 13: carForwardWithTime
- blockly:
    type: "uKitMotion_carForwardWithTime"
    message0: "car forward speed %1 for %2 ms"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
    tooltip: "Move robot forward for specified time (non-blocking)"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "transformer", "timing"]
    args:
      - name: "speed"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "100"
      - name: "time"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "1000"

# Block 14: motionCase
- blockly:
    type: "uKitMotion_motionCase"
    message0: "motion case %1 times %2"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
    tooltip: "Execute predefined movement pattern"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "controller", "sequences"]
    args:
      - name: "caseId"
        type: "field_dropdown"
        options:
          - ["Getup", "GETUP"]
          - ["Sitdown", "SITDOWN"]
          - ["Car", "CAR"]
          - ["Forward", "FORWARD"]
          - ["Back", "BACK"]
          - ["Left", "LEFT"]
          - ["Right", "RIGHT"]
          - ["Omotion", "OMOTION"]
          - ["Button", "BUTTON"]
          - ["Lift", "LIFT"]
          - ["Lift Hand", "LIFT_HAND"]
          - ["Head", "HEAD"]
          - ["Zero", "ZERO"]
        check: ["String"]
        inputDefaults: "CAR"
      - name: "times"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "1"

# Block 15: motionForward
- blockly:
    type: "uKitMotion_motionForward"
    message0: "motion forward times %1"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
