# uKit Hardware Block Catalog - Robot Motion Category
schema: "https://raw.githubusercontent.com/platformio-platformio-blocks/platformio-blocks.github.io/schemas/block-catalog.schema.json"

id: "ukit-robot-motion-blocks"
author: "uKit Team"
version: "1.0.0"
description: "Blockly blocks for uKit Explore 2 robot motion and movement sequences - transformer car controls, motion patterns, and line tracking"
category: "Robot Motion"
colour: "#1565C0"  # Deep blue
tags: ["robot-motion", "transformer", "movement", "sequences", "uKit Explore 2"]
runtime: "arduino:cpp"
targets:
  - "ubtrobot:avr:ukit_explore2"

implementations:
  - blocks:

# Value Blocks (4)

# Block 1: getMotionCaseCount
- blockly:
    type: "uKitMotion_getMotionCaseCount"
    message0: "get motion case count()"
    output: "Number"
    colour: "#1565C0"
    tooltip: "Returns total number of predefined motion cases available"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "controller", "sequences"]

# Block 2: getMotionCurrentState
- blockly:
    type: "uKitMotion_getMotionCurrentState"
    message0: "get motion current state()"
    output: "String"
    colour: "#1565C0"
    tooltip: "Returns current motion state (Getup, Sitdown, Car, Forward, etc.)"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "controller", "state"]

# Block 3: getMotionAvailableCases
- blockly:
    type: "uKitMotion_getMotionAvailableCases"
    message0: "get motion available cases()"
    output: "String"
    colour: "#1565C0"
    tooltip: "Returns list of available motion case names"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "controller", "cases"]

# Block 4: getMotionDuration
- blockly:
    type: "uKitMotion_getMotionDuration"
    message0: "get motion duration()"
    output: "Number"
    colour: "#1565C0"
    tooltip: "Returns current motion execution duration in milliseconds"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "controller", "timing"]

# Statement Blocks (16)

# Block 5: carForward
- blockly:
    type: "uKitMotion_carForward"
    message0: "car forward speed %1"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
    tooltip: "Move robot forward at specified speed (0-150, PWM-based)"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "transformer", "control"]
    args:
      - name: "speed"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "100"

# Block 6: carTurnLeft
- blockly:
    type: "uKitMotion_carTurnLeft"
    message0: "car turn left speed %1"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
    tooltip: "Turn robot left with specified speed"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "transformer", "control"]
    args:
      - name: "speed"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "100"

# Block 7: carTurnRight
- blockly:
    type: "uKitMotion_carTurnRight"
    message0: "car turn right speed %1"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
    tooltip: "Turn robot right with specified speed"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "transformer", "control"]
    args:
      - name: "speed"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "100"

