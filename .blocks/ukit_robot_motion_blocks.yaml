    message0: "line tracking turn left speed %1"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#1565C0"
    tooltip: "Turn left while following line (for line follower robots)"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["robot-motion", "line-tracking", "control"]
    args:
      - name: "speed"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "80"

