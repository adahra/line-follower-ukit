# uKit Hardware Block Catalog - Sensors Category
schema: "https://raw.githubusercontent.com/platformio-platformio-blocks/platformio-blocks.github.io/schemas/block-catalog.schema.json"

id: "ukit-sensor-blocks"
author: "uKit Team"
version: "1.0.1"
description: "Blockly blocks for uKit Explore 2 hardware sensors - ultrasonic, infrared, light, sound, color, button, humiture, and eye lamp"
category: "Sensors"
colour: "#558B2F"  # Green lime
tags: ["sensors", "ultrasonic", "infrared", "light", "sound", "color", "button", "humiture", "eyelamp", "uKit Explore 2"]
runtime: "arduino:cpp"
targets:
  - "ubtrobot:avr:ukit_explore2"

implementations:
  - blocks:

# Value Blocks (19)

# Block 1: readUltrasonicDistance
- blockly:
    type: "uKitSensor_readUltrasonicDistance"
    message0: "readUltrasonicDistance %1 sensorId"
    output: "Number"
    colour: "#558B2F"
    tooltip: "Returns distance in centimeters from ultrasonic sensor"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["sensors", "ultrasonic"]
    args:
      - name: "sensorId"
        type: "field_dropdown"
        options:
          - ["1", "1"]
          - ["2", "2"]
        check: ["Number", "int"]
        inputDefaults: "1"

# Block 2: readInfraredDistance
- blockly:
