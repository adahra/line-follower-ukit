# Block 23: setEyelightLook
- blockly:
    type: "uKitSensor_setEyelightLook"
    message0: "set eyelight look %1 times %2 R%3 G%4 B%5"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#558B2F"
    tooltip: "Set eye lamp to specific emoticon and color (non-blocking)"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["sensors", "eyelamp"]
    args:
      - name: "face"
        type: "field_dropdown"
        options:
          - ["Smile", "SMILE"]
          - ["Sad", "SAD"]
          - ["Angry", "ANGRY"]
          - ["Surprised", "SURPRISED"]
          - ["Sleepy", "SLEEPY"]
        check: ["String"]
      - name: "times"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "1"
      - name: "R"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "255"
      - name: "G"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "255"
      - name: "B"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "255"

