# Statement Blocks (5)

# Block 20: setUltrasonicRgbled
- blockly:
    type: "uKitSensor_setUltrasonicRgbled"
    message0: "set ultrasonic LED color %1 R%2 G%3 B%4"
    previousStatement: "null"
    nextStatement: "null"
    colour: "#558B2F"
    tooltip: "Set ultrasonic sensor LED color using RGB values"
    helpUrl: "docs/ukit_explore/master.md"
    tags: ["sensors", "ultrasonic", "led"]
    args:
      - name: "sensorId"
        type: "field_dropdown"
        options:
          - ["1", "1"]
          - ["2", "2"]
        check: ["Number", "int"]
        inputDefaults: "1"
      - name: "R"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "0"
      - name: "G"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "0"
      - name: "B"
        type: "input_value"
        check: ["Number", "int"]
        inputDefaults: "0"

# Block 21: setUltrasonicRgbledOff
